<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Điều dưỡng khoa Ngoại</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--bg:#dfe9ef;--fg:#12303a;--pn:#ffffffee;--ac:#1f9c8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a26;--fg:#e9f2f6;--pn:#16232fee}}
:root[data-theme="dark"]{--bg:#101a26;--fg:#e9f2f6;--pn:#16232fee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--pn);font-size:13px;pointer-events:none}
#hud b{white-space:nowrap}#ob{flex:1;font-weight:600}#tm{font-variant-numeric:tabular-nums;font-weight:700}
#toast{position:fixed;left:50%;top:52px;transform:translateX(-50%);background:#000b;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:70%;text-align:center}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#ffffff40;border:2px solid #ffffff88;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffcc;box-shadow:0 2px 6px #0006}
#btn{position:fixed;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));min-width:104px;height:104px;padding:0 10px;border-radius:52px;border:3px solid #fff;background:var(--ac);color:#fff;font-size:14px;font-weight:700;opacity:.55;touch-action:none}
#btn.on{opacity:1;box-shadow:0 0 0 4px #1f9c8c66}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008}
.p{background:var(--pn);padding:16px 22px;border-radius:14px;max-width:560px;text-align:center;max-height:92%;overflow:auto}
.p h1{margin:0 0 4px;font-size:22px}.p small{opacity:.75}
.p button{margin:4px;padding:8px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-weight:700;font-size:14px}
.p button:disabled{opacity:.4}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:4px;border:3px solid transparent;cursor:pointer}.sw.s{border-color:var(--fg)}
#rot{display:none;position:fixed;inset:0;background:#000d;color:#fff;align-items:center;justify-content:center;font-size:20px;z-index:9;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><b id="ln"></b><span id="ob"></span><span id="tm"></span></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button id="btn">Tương tác</button>
<div id="ov"></div>
<div id="rot">📱 Hãy xoay ngang màn hình để chơi</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
let W,H,D=devicePixelRatio||1,Z=1;
function rs(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;Z=Math.max(.75,H/400)}
addEventListener('resize',rs);rs();
const TW=64,TH=32,MW=60,MH=21,P=(x,y)=>[(x-y)*TW/2,(x+y)*TH/2];
function sh(h,f){const n=parseInt(h.slice(1),16);return`rgb(${(n>>16)*f|0},${(n>>8&255)*f|0},${(n&255)*f|0})`}
// ---- MAP ----
const fl=[],zc=[],fc=[];for(let y=0;y<MH;y++){fl.push(Array(MW).fill(0));zc.push(Array(MW).fill(''));}
function R(a,b,c,d,col){for(let y=b;y<=d;y++)for(let x=a;x<=c;x++){fl[y][x]=1;zc[y][x]=col}}
const blk=Array.from({length:MH},()=>Array(MW).fill(0)),O=[],S=[],DR=[],dm={};
R(1,10,57,12,'#dadee4');
const EV=[[2,'320'],[8,'318'],[14,'316'],[20,'314'],[26,'312']];
function door(x,y,n,col){fl[y][x]=1;zc[y][x]=col;const d={x,y,n,o:false};DR.push(d);dm[y*MW+x]=d;S.push({k:x+y+1,f:()=>drDraw(d)})}
EV.forEach(([s,n])=>{R(s,4,s+4,8,'#cfe3f2');door(s+2,9,n,'#cfe3f2')});
R(32,4,43,9,'#ebe5cf');R(45,4,50,8,'#d4ebd8');door(47,9,'Tiểu phẫu','#d4ebd8');R(52,4,57,8,'#ecdcc8');door(54,9,'Bác sĩ','#ecdcc8');
R(16,14,23,19,'#e6e3d8');door(19,13,'319','#e6e3d8');R(25,14,32,19,'#e6e3d8');door(28,13,'317','#e6e3d8');
R(34,14,41,19,'#e1e8f0');door(37,13,'315','#e1e8f0');
R(48,14,57,19,'#f2e0e8');door(52,13,'Phòng ngủ ĐD','#f2e0e8');
for(let y=0;y<MH;y++){fc.push([]);for(let x=0;x<MW;x++)fc[y].push(fl[y][x]?sh(zc[y][x],(x+y)&1?.96:1):'')}
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(fl[y][x])continue;let a=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const yy=y+j,xx=x+i;if(yy>=0&&xx>=0&&yy<MH&&xx<MW&&fl[yy][xx])a=1}
 if(a)S.push({k:x+y+1,f:()=>box(x,y,1,1,14,'#b4c2cf')})}
function add(id,x,y,w,h,z,c,nm,o={}){const ob={id,x,y,w,h,z,c,nm,...o};O.push(ob);for(let j=0;j<h;j++)for(let i=0;i<w;i++)blk[y+j][x+i]=1;S.push({k:x+w/2+y+h/2,f:()=>ob.d?ob.d(ob):box(x,y,w,h,z,c)});return ob}
function dec(x,y,w,h,z0,z,c){S.push({k:x+w/2+y+h/2+.2,f:()=>box(x,y,w,h,z,c,z0)})}
const BL=['#7fb4e0','#e6a3b8','#9fd3a6','#e8cf8a','#b9a6e0'];let bi=0;
function bed(r,n,x,y){add(r+'-'+n,x,y,2,1,8,'#dfe6ee','Giường '+r+'-'+n,{int:1,bed:1,bl:BL[bi++%5],d:dBed})}
function dBed(o){box(o.x,o.y,2,1,8,'#dfe6ee');box(o.x+.05,o.y+.1,.45,.8,10,'#ffffff');box(o.x+.6,o.y+.1,1.3,.8,11,o.bl);
 const p=P(o.x+.3,o.y+.5);X.fillStyle='#f0c9a4';X.beginPath();X.arc(p[0],p[1]-14,5,0,7);X.fill()}
EV.forEach(([s,n])=>{[0,1,2].forEach(k=>bed(n,k+1,s+3,4+2*k));dec(s+1,3,1,1,16,23,'#f4f8fb')});
[[16,'319'],[25,'317']].forEach(([s,n])=>{for(let j=0;j<5;j++){bed(n,2*j+1,s+1,15+j);bed(n,2*j+2,s+5,15+j)}dec(s+3,20,2,1,16,22,'#555d66')});
for(let j=0;j<3;j++){bed('315',2*j+1,35,15+2*j);bed('315',2*j+2,39,15+2*j);add('mon'+j,41,15+2*j,1,1,14,'#2d3a45','Máy hồi sức');add('mop'+j,34,15+2*j,1,1,14,'#2d3a45','Máy hồi sức')}dec(37,20,2,1,16,23,'#f4f8fb');
add('sup',33,4,4,1,24,'#8a6d4b','Kho vật tư',{int:1});add('duty',40,4,3,2,9,'#7b8fb5','Phòng nghỉ trực',{int:1});
add('desk',36,7,3,1,10,'#b9895b','Bàn nhận bệnh',{int:1});add('dk1',32,9,5,1,10,'#a67c52','Bàn hành chính');add('dk2',39,9,5,1,10,'#a67c52','Bàn hành chính');

add('surg',47,5,2,2,9,'#cfd8dc','Bàn tiểu phẫu',{int:1});add('sink',50,6,1,1,12,'#9fb6c4','Bồn rửa tay',{int:1});
add('doc',54,4,2,1,10,'#9c7a5b','Bàn bác sĩ',{int:1});
add('lift',57,10,1,3,38,'#9aa7b4','Thang máy',{int:1});add('stairs',1,10,1,3,12,'#8c96a0','Cầu thang bộ',{int:1});
add('ward',48,15,1,2,34,'#c9a27a','Tủ đồ (đổi trang phục)',{int:1});
add('nb1',54,15,2,1,8,'#e9eef5','Giường ĐD');add('nb2',54,18,2,1,8,'#e9eef5','Giường ĐD');
function box(x,y,w,h,z,c,z0=0){const A=P(x,y),B=P(x+w,y),Q=P(x+w,y+h),Dd=P(x,y+h),t=-z,b=-z0;
 pl([[A[0],A[1]+t],[B[0],B[1]+t],[Q[0],Q[1]+t],[Dd[0],Dd[1]+t]],sh(c,1.08));
 pl([[Dd[0],Dd[1]+b],[Q[0],Q[1]+b],[Q[0],Q[1]+t],[Dd[0],Dd[1]+t]],sh(c,.78));
 pl([[B[0],B[1]+b],[Q[0],Q[1]+b],[Q[0],Q[1]+t],[B[0],B[1]+t]],sh(c,.58))}
function pl(a,c){X.beginPath();X.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)X.lineTo(a[i][0],a[i][1]);X.closePath();X.fillStyle=c;X.fill();X.strokeStyle='#0002';X.lineWidth=.6;X.stroke()}
function drDraw(d){if(d.o)box(d.x,d.y,.12,.9,16,'#a9744a');else box(d.x,d.y,1,1,16,'#a9744a');
 const p=P(d.x+.5,d.y+.5);X.font='bold 11px sans-serif';X.textAlign='center';X.lineWidth=3;X.strokeStyle='#000a';X.fillStyle='#fff';X.strokeText(d.n,p[0],p[1]-24);X.fillText(d.n,p[0],p[1]-24)}
S.sort((a,b)=>a.k-b.k);
const solid=(x,y)=>{const cx=Math.floor(x),cy=Math.floor(y);if(cx<0||cy<0||cx>=MW||cy>=MH||!fl[cy][cx]||blk[cy][cx])return 1;const d=dm[cy*MW+cx];return d&&!d.o?1:0};
const hit=(x,y)=>solid(x-.22,y-.22)||solid(x+.22,y-.22)||solid(x-.22,y+.22)||solid(x+.22,y+.22);
// ---- GAME DATA ----
const OF=[{n:'Xanh dương',t:'#2f80d0',b:'#2a6aa8'},{n:'Hồng',t:'#e87aa0',b:'#c85d84'},{n:'Xanh lá',t:'#33a67a',b:'#2a8a63'},{n:'Trắng',t:'#f3f5f7',b:'#cfd6dd'},{n:'Xanh ngọc',t:'#2fb3a3',b:'#238a7d'}];
let oi=0;
const s=(o,t,v,c)=>({o,t,v,c});
let LV=[
{n:'Màn 1: Nhận ca & đo sinh hiệu',t:130,s:[s('desk','Nhận bàn giao ca ở bàn hành chính','Nhận bàn giao'),s('312-1','Đo sinh hiệu giường 1, phòng 312','Đo sinh hiệu'),s('312-2','Đo sinh hiệu giường 2, phòng 312','Đo sinh hiệu'),s('312-3','Đo sinh hiệu giường 3, phòng 312','Đo sinh hiệu')]},
{n:'Màn 2: Phát thuốc',t:150,s:[s('sup','Lấy thuốc ở tủ thuốc khu hành chính','Lấy thuốc','💊'),s('314-1','Phát thuốc phòng 314, giường 1','Phát thuốc'),s('314-3','Phát thuốc phòng 314, giường 3','Phát thuốc'),s('316-2','Phát thuốc phòng 316, giường 2','Phát thuốc'),s('318-1','Phát thuốc phòng 318, giường 1','Phát thuốc','')]},
{n:'Màn 3: Truyền dịch',t:170,s:[s('sup','Lấy dịch truyền ở kho vật tư','Lấy dịch truyền','🧴'),s('315-1','Truyền dịch phòng 315, giường 1','Truyền dịch'),s('315-5','Truyền dịch phòng 315, giường 5','Truyền dịch'),s('317-3','Truyền dịch phòng 317, giường 3','Truyền dịch'),s('317-8','Truyền dịch phòng 317, giường 8','Truyền dịch','')]},
{n:'Màn 4: Thay băng & tiểu phẫu',t:200,s:[s('surg','Chuẩn bị bàn ở phòng tiểu phẫu','Chuẩn bị bàn'),s('sink','Rửa tay vô khuẩn','Rửa tay'),s('sup','Lấy bộ thay băng ở kho vật tư','Lấy bộ băng','🩹'),s('319-4','Thay băng phòng 319, giường 4','Thay băng'),s('319-9','Thay băng phòng 319, giường 9','Thay băng'),s('surg','Dọn dụng cụ ở phòng tiểu phẫu','Dọn dụng cụ','')]},
{n:'Màn 5: Ca trực tổng hợp',t:260,s:[s('desk','Nhận bệnh mới ở bàn hành chính','Nhận bệnh'),s('320-2','Đo sinh hiệu bệnh nhân mới, phòng 320','Đo sinh hiệu'),s('sup','Lấy thuốc ở tủ thuốc khu hành chính','Lấy thuốc','💊'),s('320-2','Phát thuốc cho bệnh nhân phòng 320','Phát thuốc',''),s('315-2','Hỗ trợ bệnh nhân hồi sức phòng 315','Hỗ trợ'),s('lift','Đưa bệnh nhân đi cận lâm sàng bằng thang máy','Gọi thang máy'),s('doc','Báo cáo bác sĩ','Báo cáo'),s('duty','Về phòng nghỉ trực','Nghỉ trực')]}];
let st='menu',lv=0,si=0,timer=0,carry='',acting=null,near=null,unlocked=1,t0=0;
const pl_={x:37.5,y:11.5},cam={x:0,y:0};const pp=pl_;
const kb={};let jv=[0,0];
// ---- INPUT ----
addEventListener('keydown',e=>{const k=e.key.toLowerCase();kb[k]=1;if(k==='e'||k===' '||k==='enter'){e.preventDefault();act()}if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>delete kb[e.key.toLowerCase()]);
const J=$('joy'),K=$('knob');let jid=null;
function mv(e){const r=J.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;const m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m}jv=[dx/R,dy/R];K.style.transform=`translate(${dx}px,${dy}px)`}
J.addEventListener('pointerdown',e=>{jid=e.pointerId;J.setPointerCapture(jid);mv(e)});
J.addEventListener('pointermove',e=>{if(e.pointerId===jid)mv(e)});
const ju=e=>{if(e.pointerId===jid){jid=null;jv=[0,0];K.style.transform=''}};J.addEventListener('pointerup',ju);J.addEventListener('pointercancel',ju);
$('btn').addEventListener('pointerdown',e=>{e.preventDefault();act()});
function say(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(say.h);say.h=setTimeout(()=>t.style.opacity=0,2200)}
const rd=(x,y,w,h)=>Math.hypot(Math.max(x-pp.x,0,pp.x-x-w),Math.max(y-pp.y,0,pp.y-y-h));
function findNear(){let b=null,bd=1.05;for(const d of DR){const q=rd(d.x,d.y,1,1);if(q<bd){bd=q;b={dr:d}}}
 for(const o of O){if(!o.int)continue;const q=rd(o.x,o.y,o.w,o.h);if(q<bd){bd=q;b=o}}return b}
const cur=()=>LV[lv].s[si];
function act(){if(st!=='play'||acting||!near)return;const n=near;
 if(n.dr){const d=n.dr;if(d.o&&Math.floor(pp.x)===d.x&&Math.floor(pp.y)===d.y)return say('Bước ra khỏi cửa trước đã');d.o=!d.o;return say((d.o?'Mở':'Đóng')+' cửa '+d.n)}
 const q=cur();if(q&&q.o===n.id){acting={t:0,d:1.3,v:q.v};return}
 if(n.id==='ward'){oi=(oi+1)%OF.length;return say('Đổi trang phục: '+OF[oi].n)}
 say(n.bed?'Bệnh nhân ổn định, chưa cần can thiệp':'Chưa cần làm ở đây')}
function fin(){const q=cur();acting=null;if('c' in q)carry=q.c;si++;say('✔ Hoàn thành: '+q.v);if(si>=LV[lv].s.length)end(true)}
function end(w){st=w?'win':'lose';if(w)unlocked=Math.max(unlocked,Math.min(lv+2,LV.length));
 const f=timer/LV[lv].t,stars=f>.5?3:f>.25?2:1;
 $('ov').style.display='flex';$('ov').innerHTML=`<div class="p"><h1>${w?'Hoàn thành ca! '+'⭐'.repeat(stars):'Hết giờ ⏰'}</h1><p>${LV[lv].n}</p>${w?`<small>Còn lại ${Math.ceil(timer)} giây</small><br>`:''}<button onclick="start(${lv})">Chơi lại</button>${w&&lv+1<LV.length?`<button onclick="start(${lv+1})">Màn tiếp theo ▶</button>`:''}<button onclick="menu()">Menu</button></div>`}
function start(i){applyLV();if(i>=LV.length)i=0;lv=i;si=0;timer=LV[i].t;carry='';acting=null;pp.x=37.5;pp.y=11.5;DR.forEach(d=>d.o=false);st='play';$('ov').style.display='none';$('ln').textContent='Màn '+(i+1);say(i==0?'Joystick/WASD để đi, nút Tương tác (E) để mở cửa & làm việc':'Bắt đầu ca trực!')}
function menu(){applyLV();st='menu';$('ov').style.display='flex';
 $('ov').innerHTML=`<div class="p"><h1>🏥 Điều dưỡng khoa Ngoại</h1><small>Chọn trang phục (cũng đổi được ở tủ đồ trong phòng ngủ ĐD)</small><div>${OF.map((o,i)=>`<span class="sw ${i==oi?'s':''}" style="background:${o.t}" onclick="oi=${i};menu()" title="${o.n}"></span>`).join('')}</div><div>${LV.map((l,i)=>`<button ${i<unlocked?'':'disabled'} onclick="start(${i})">${l.n}</button><br>`).join('')}</div></div>`}
// ---- UPDATE / DRAW ----
function upd(dt){if(st!=='play')return;timer-=dt;if(timer<=0){timer=0;return end(false)}
 if(acting){acting.t+=dt;if(acting.t>=acting.d)fin();return}
 let sx=(kb.arrowright||kb.d?1:0)-(kb.arrowleft||kb.a?1:0)+jv[0],sy=(kb.arrowdown||kb.s?1:0)-(kb.arrowup||kb.w?1:0)+jv[1];
 const m=Math.hypot(sx,sy);if(m>.12){let gx=sx+2*sy,gy=2*sy-sx;const g=Math.hypot(gx,gy),sp=4.3*Math.min(1,m);gx=gx/g*sp*dt;gy=gy/g*sp*dt;
  if(!hit(pp.x+gx,pp.y))pp.x+=gx;if(!hit(pp.x,pp.y+gy))pp.y+=gy}
 near=findNear()}
function drawP(){const p=P(pp.x,pp.y),o=OF[oi];X.fillStyle='#0004';X.beginPath();X.ellipse(p[0],p[1],11,5,0,0,7);X.fill();
 X.fillStyle=o.b;X.fillRect(p[0]-6,p[1]-12,12,10);X.fillStyle=o.t;X.fillRect(p[0]-7,p[1]-26,14,15);
 X.fillStyle='#f0c9a4';X.beginPath();X.arc(p[0],p[1]-32,6.5,0,7);X.fill();X.fillStyle='#4a3326';X.beginPath();X.arc(p[0],p[1]-34,6.8,Math.PI,0);X.fill();
 X.fillStyle='#fff';X.fillRect(p[0]-5,p[1]-41,10,4);X.fillStyle='#d33';X.fillRect(p[0]-1,p[1]-41,2,4);
 if(carry){X.font='16px sans-serif';X.textAlign='center';X.fillText(carry,p[0]+13,p[1]-24)}
 if(acting){X.fillStyle='#000a';X.fillRect(p[0]-18,p[1]-52,36,6);X.fillStyle='#3ddc97';X.fillRect(p[0]-17,p[1]-51,34*acting.t/acting.d,4)}}
function draw(t){X.setTransform(D,0,0,D,0,0);X.fillStyle='#1b2736';X.fillRect(0,0,W,H);
 const tp=P(pp.x,pp.y);if(!cam.x&&!cam.y){cam.x=tp[0];cam.y=tp[1]}cam.x+=(tp[0]-cam.x)*.12;cam.y+=(tp[1]-cam.y)*.12;
 X.setTransform(D*Z,0,0,D*Z,D*(W/2-cam.x*Z),D*(H/2-cam.y*Z+30));
